[package]
name = "abyssal-sim"
version = "0.1.0"
edition = "2021"
description = "Cellular-automaton particle simulation for Abyssal Drift"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
